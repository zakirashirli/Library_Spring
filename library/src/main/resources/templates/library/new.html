<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{app.bookCreate}">Add Book</title>
    <link rel="stylesheet" th:href="@{/css/form-page.css}">
</head>
<body>
<main class="form-shell">
    <section class="form-card">
        <div class="form-header">
            <p class="eyebrow" th:text="#{nav.books}">Books</p>
            <h1 th:text="#{app.bookCreate}">Add Book</h1>
            <p>Create a new catalog item and assign it to an author.</p>
        </div>

        <form th:action="@{/admin/books}" th:object="${book}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="field">
                <label for="title" th:text="#{book.title}">Title</label>
                <input id="title"
                       type="text"
                       th:field="*{title}"
                       th:classappend="${#fields.hasErrors('title')} ? ' error-field' : ''">
                <span class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Title error</span>
            </div>

            <div class="field">
                <label for="authorId" th:text="#{book.author}">Author</label>
                <select id="authorId"
                        th:field="*{authorId}"
                        th:classappend="${#fields.hasErrors('authorId')} ? ' error-field' : ''">
                    <option value="" disabled selected>Select an author</option>
                    <option th:each="author : ${authors}"
                            th:value="${author.id}"
                            th:text="${author.name}">Author</option>
                </select>
                <span class="error" th:if="${#fields.hasErrors('authorId')}" th:errors="*{authorId}">Author error</span>
            </div>

            <div class="field">
                <label for="price" th:text="#{book.price}">Price</label>
                <input id="price"
                       type="number"
                       step="0.01"
                       th:field="*{price}"
                       th:classappend="${#fields.hasErrors('price')} ? ' error-field' : ''">
                <span class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}">Price error</span>
            </div>

            <div class="field">
                <label for="amount" th:text="#{book.amount}">Amount</label>
                <input id="amount"
                       type="number"
                       th:field="*{amount}"
                       th:classappend="${#fields.hasErrors('amount')} ? ' error-field' : ''">
                <span class="error" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}">Amount error</span>
            </div>

            <div class="form-actions">
                <button type="submit" th:text="#{button.save}">Save</button>
                <a class="secondary-link" th:href="@{/admin/books}" th:text="#{button.backToBooks}">Back to Books</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
