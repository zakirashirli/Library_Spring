<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Books</title>
</head>
<body>
<style>

    /* =============================
       Base Layout
    ============================= */

    * {
        box-sizing: border-box;
    }

    body {
        padding: 40px;
        font-family: "Inter", "Segoe UI", sans-serif;
        background: #1e1e1e;
        color: #e4e4e4;
    }

    /* Light mode support */
    @media (prefers-color-scheme: light) {
        body {
            background: #f5f7fa;
            color: #222;
        }
    }

    /* =============================
       Heading
    ============================= */

    h2 {
        font-size: 28px;
        margin-bottom: 25px;
        font-weight: 600;
    }

    /* =============================
       Add Book Button
    ============================= */

    a[href*="/books/new"] {
        display: inline-block;
        margin-bottom: 20px;
        padding: 10px 18px;
        border-radius: 8px;
        background: linear-gradient(135deg, #4CAF50, #2ecc71);
        color: #fff;
        font-weight: 600;
        text-decoration: none;
        transition: 0.2s ease;
    }

    a[href*="/books/new"]:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(0,0,0,0.3);
    }

    /* =============================
       Search Form
    ============================= */

    form {
        margin-bottom: 20px;
    }

    input[type="text"] {
        padding: 9px 12px;
        border-radius: 6px;
        border: 1px solid #555;
        background: #2c2c2c;
        color: #fff;
        width: 220px;
        outline: none;
        transition: 0.2s;
    }

    input[type="text"]:focus {
        border-color: #4CAF50;
    }

    button {
        padding: 9px 14px;
        border-radius: 6px;
        border: none;
        background: #3a7bd5;
        color: white;
        font-weight: 500;
        cursor: pointer;
        margin-left: 6px;
        transition: 0.2s;
    }

    button:hover {
        background: #2f5ea7;
    }

    /* Reset link */
    form a {
        margin-left: 10px;
        color: #aaa;
        text-decoration: none;
    }

    form a:hover {
        text-decoration: underline;
    }

    /* Light mode form */
    @media (prefers-color-scheme: light) {
        input[type="text"] {
            background: #fff;
            color: #000;
            border: 1px solid #ccc;
        }
    }

    /* =============================
       Table Styling
    ============================= */

    table {
        width: 100%;
        border-collapse: collapse;
        border-radius: 10px;
        overflow: hidden;
        background: #2b2b2b;
        box-shadow: 0 8px 25px rgba(0,0,0,0.25);
    }

    /* Light mode table */
    @media (prefers-color-scheme: light) {
        table {
            background: #ffffff;
        }
    }

    th {
        background: #333;
        padding: 14px;
        text-align: left;
        font-weight: 600;
        font-size: 14px;
    }

    td {
        padding: 12px 14px;
        font-size: 14px;
    }

    /* Light mode header */
    @media (prefers-color-scheme: light) {
        th {
            background: #e9ecef;
            color: #222;
        }
    }

    /* Row styling */
    tr {
        transition: 0.2s ease;
    }

    tr:nth-child(even) {
        background: #252525;
    }

    @media (prefers-color-scheme: light) {
        tr:nth-child(even) {
            background: #f8f9fa;
        }
    }

    tr:hover {
        background: #3a3a3a;
    }

    @media (prefers-color-scheme: light) {
        tr:hover {
            background: #eef2f7;
        }
    }

    /* =============================
       Action Links
    ============================= */

    td a {
        margin-right: 10px;
        text-decoration: none;
        font-weight: 500;
        font-size: 13px;
        transition: 0.2s;
    }

    td a:first-child {
        color: #3498db;
    }

    td a:first-child:hover {
        color: #217dbb;
    }

    td a:last-child {
        color: #e74c3c;
    }

    td a:last-child:hover {
        color: #c0392b;
    }

    /* =============================
       Pagination
    ============================= */

    div[style*="margin-top:20px"] {
        margin-top: 25px !important;
    }

    div[style*="margin-top:20px"] a {
        padding: 6px 10px;
        margin: 0 3px;
        text-decoration: none;
        border-radius: 5px;
        background: #333;
        color: #fff;
        font-size: 13px;
        transition: 0.2s;
    }

    div[style*="margin-top:20px"] a:hover {
        background: #4CAF50;
    }

    @media (prefers-color-scheme: light) {
        div[style*="margin-top:20px"] a {
            background: #e9ecef;
            color: #333;
        }
    }

</style>

  <h2>Book List</h2>

    <form th:action="@{/logout}" method="post">
        <button type="submit">Logout</button>
    </form>

  <a th:if="${isAdmin}" th:href="@{/books/new}">+Add New Book</a>

  <br>

    <form th:action="@{/books/search}" method="get" style="margin-bottom:15px;">
        <input type="text"
               name="keyword"
               placeholder="Search by Title"
               th:value="${keyword}">

        <button type="submit">Search</button>
        <a th:href="@{/books}" style="margin-left:10px">Reset</a>
    </form>

    <table border="1">
        <tr>
            <th>Title</th>
            <th>Author</th>
            <th>Price</th>
            <th>Amount</th>
            <th th:if="${isAdmin}">Actions</th>
        </tr>
        <tr th:each="book : ${books}">
            <td th:text="${book.title}"></td>
            <td th:text="${book.author}"></td>
            <td th:text="${book.price}"></td>
            <td th:text="${book.amount}"></td>
            <td>
                <a th:href="@{/books/edit/{id}(id=${book.id})}">Edit</a>
                <a th:href="@{/books/delete/{id}(id=${book.id})}"
                   onclick="return confirm('Are you sure?')">Delete</a>
            </td>
        </tr>
    </table>
    <div style="margin-top:20px">
        <a th:if="${currentPage > 0}" th:href="@{/books(page=${currentPage - 1}, size=${size})}">←</a>

        <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">

<!--            если есть search-->
            <a
                    th:if="${keyword != null}"
                    th:href="@{/books/search(keyword=${keyword}, page=${i}, size=${size})}"
                    th:text="${i + 1}"
                    style="${i == currentPage} ? 'font-weight:bold' : ''">
            </a>

<!--            если обычный список-->
            <a
                    th:if="${keyword == null}"
                    th:href="@{/books(page=${i}, size=${size})}"
                    th:text="${i + 1}"
                    style="${i == currentPage} ? 'font-weight:bold' : ''">
            </a>
        </span>

        <a th:if="${currentPage + 1 < totalPages}" th:href="@{/books(page=${currentPage + 1}, size=${size})}">→</a>
    </div>
</body>
</html>
