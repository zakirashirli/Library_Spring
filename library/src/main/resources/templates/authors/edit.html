<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{app.authorEdit}">Edit Author</title>
    <link rel="stylesheet" th:href="@{/css/form-page.css}">
</head>
<body>
<main class="form-shell">
    <section class="form-card">
        <div class="form-header">
            <p class="eyebrow" th:text="#{nav.authors}">Authors</p>
            <h1 th:text="#{app.authorEdit}">Edit Author</h1>
            <p>Update the author name and keep existing book relationships intact.</p>
        </div>

        <div class="lang-switch">
            <a th:href="@{/admin/authors/edit/{id}(id=${author.id}, lang='en')}" th:text="#{lang.en}">EN</a>
            <a th:href="@{/admin/authors/edit/{id}(id=${author.id}, lang='ru')}" th:text="#{lang.ru}">RU</a>
        </div>

        <form th:action="@{/admin/authors/update/{id}(id=${author.id})}" th:object="${author}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="field">
                <label for="name" th:text="#{author.name}">Author Name</label>
                <input id="name"
                       type="text"
                       th:field="*{name}"
                       th:placeholder="#{placeholder.authorName}"
                       th:classappend="${#fields.hasErrors('name')} ? ' error-field' : ''">
                <span class="error"
                      th:if="${#fields.hasErrors('name')}"
                      th:errors="*{name}">Author name error</span>
            </div>

            <div class="form-actions">
                <button type="submit" th:text="#{button.save}">Save</button>
                <a class="secondary-link" th:href="@{/admin/authors}" th:text="#{button.backToAuthors}">Back to Authors</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
