<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{app.authorList}">Author Directory</title>
    <link rel="stylesheet" th:href="@{/css/authors.css}">
</head>
<body>
<main class="authors-page">
    <section class="hero">
        <div>
            <p class="eyebrow" th:text="#{nav.authors}">Authors</p>
            <h1 th:text="#{app.authorList}">Author Directory</h1>
            <p class="hero-copy">Manage writers, keep your catalog tidy, and jump into edits without bouncing between plain tables.</p>
        </div>

        <div class="toolbar">
            <div class="lang-switch">
                <a th:href="@{/admin/authors(lang='en')}" th:text="#{lang.en}">EN</a>
                <a th:href="@{/admin/authors(lang='ru')}" th:text="#{lang.ru}">RU</a>
            </div>
            <div class="actions">
                <a class="ghost-button" th:href="@{/admin/books}" th:text="#{button.backToBooks}">Back to Books</a>
                <a class="ghost-button" th:href="@{/admin/users}" th:text="#{nav.users}">Users</a>
                <a class="primary-button" th:href="@{/admin/authors/new}" th:text="#{button.addAuthor}">New Author</a>
            </div>
        </div>
    </section>

    <section class="table-card">
        <table>
            <thead>
            <tr>
                <th th:text="#{table.id}">ID</th>
                <th th:text="#{table.name}">Name</th>
                <th th:text="#{table.books}">Books</th>
                <th th:text="#{table.actions}">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(authors)}">
                <td class="empty" colspan="4" th:text="#{empty.authors}">No authors found yet.</td>
            </tr>
            <tr th:each="author : ${authors}">
                <td th:text="${author.id}">1</td>
                <td th:text="${author.name}">Author Name</td>
                <td>
                    <a class="books-link"
                       th:href="@{/admin/books(authorId=${author.id})}"
                       th:text="${author.bookCount}">0</a>
                </td>
                <td class="row-actions">
                    <a class="books-link" th:href="@{/admin/books(authorId=${author.id})}" th:text="#{button.viewBooks}">View Books</a>
                    <a class="edit-link" th:href="@{/admin/authors/edit/{id}(id=${author.id})}" th:text="#{button.edit}">Edit</a>
                    <a class="delete-link"
                       th:href="@{/admin/authors/delete/{id}(id=${author.id})}"
                       th:onclick="|return confirm('#{confirm.deleteAuthor}')|"
                       th:text="#{button.delete}">Delete</a>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
