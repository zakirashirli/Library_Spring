<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{app.accessDenied}">Access Denied</title>
    <link rel="stylesheet" th:href="@{/css/error-page.css}">
</head>
<body>
<main class="error-shell">
    <section class="error-card">
        <span class="status" th:text="#{error.page.status403}">Error 403</span>
        <h1 th:text="#{app.accessDenied}">Access Denied</h1>
        <p th:text="#{error.accessDenied.message}">You do not have permission to open this page.</p>
        <div class="error-actions">
            <a th:href="@{/}" th:text="#{button.backToHome}">Back to Home</a>
        </div>
    </section>
</main>
</body>
</html>
