<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{error.page.title}">Error</title>
    <link rel="stylesheet" th:href="@{/css/error-page.css}">
</head>
<body>
<main class="error-shell">
    <section class="error-card">
        <span class="status" th:text="#{error.page.status401}">Error 401</span>
        <h1 th:text="#{error.page.heading}">Request failed</h1>
        <p th:text="${errorMessage} ?: #{error.page.message}">We could not complete your request.</p>
        <div class="error-actions">
            <a th:href="${backUrl}" th:text="${backText}">Go to Register</a>
        </div>
    </section>
</main>
</body>
</html>
