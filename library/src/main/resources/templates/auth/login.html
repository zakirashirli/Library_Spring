<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{nav.login}">Login</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<main class="auth-shell">
    <section class="auth-hero">
        <p class="eyebrow" th:text="#{nav.login}">Login</p>
        <h1 th:text="#{auth.login.title}">Welcome Back</h1>
        <p class="hero-copy" th:text="#{auth.login.subtitle}">Sign in to manage books, authors, and your library workspace.</p>

        <div class="lang-switch">
            <a th:href="@{/login(lang='en')}" th:text="#{lang.en}">EN</a>
            <a th:href="@{/login(lang='ru')}" th:text="#{lang.ru}">RU</a>
        </div>
    </section>

    <section class="auth-card">
        <form th:action="@{/login}" method="post">
            <div class="field">
                <label for="username" th:text="#{auth.username}">Username</label>
                <input id="username" type="text" name="username" th:placeholder="#{placeholder.username}" autocomplete="username">
            </div>

            <div class="field">
                <label for="password" th:text="#{auth.password}">Password</label>
                <input id="password" type="password" name="password" th:placeholder="#{placeholder.password}" autocomplete="current-password">
            </div>

            <button type="submit" th:text="#{button.login}">Login</button>

            <p class="status error" th:if="${param.error}" th:text="#{auth.login.error}">Wrong username or password.</p>
            <p class="status success" th:if="${param.logout}" th:text="#{auth.login.logout}">Logged out successfully.</p>

            <p class="helper-link">
                <a th:href="@{/register}" th:text="#{auth.link.register}">Need an account? Register</a>
            </p>
        </form>
    </section>
</main>
</body>
</html>
