<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{nav.register}">Register</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<main class="auth-shell">
    <section class="auth-hero">
        <p class="eyebrow" th:text="#{nav.register}">Register</p>
        <h1 th:text="#{auth.register.title}">Create Your Account</h1>
        <p class="hero-copy" th:text="#{auth.register.subtitle}">Register a new account and start working with the library catalog.</p>

        <div class="lang-switch">
            <a th:href="@{/register(lang='en')}" th:text="#{lang.en}">EN</a>
            <a th:href="@{/register(lang='ru')}" th:text="#{lang.ru}">RU</a>
        </div>
    </section>

    <section class="auth-card">
        <form th:action="@{/register}" th:object="${form}" method="post">
            <div class="field">
                <label for="username" th:text="#{auth.username}">Username</label>
                <input id="username"
                       type="text"
                       th:field="*{username}"
                       th:placeholder="#{placeholder.username}"
                       autocomplete="username"
                       th:classappend="${#fields.hasErrors('username')} ? ' error-field' : ''">
                <span class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">Username error</span>
            </div>

            <div class="field">
                <label for="password" th:text="#{auth.password}">Password</label>
                <input id="password"
                       type="password"
                       th:field="*{password}"
                       th:placeholder="#{placeholder.password}"
                       autocomplete="new-password"
                       th:classappend="${#fields.hasErrors('password')} ? ' error-field' : ''">
                <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Password error</span>
            </div>

            <div class="field">
                <label for="confirmPassword" th:text="#{auth.confirmPassword}">Confirm Password</label>
                <input id="confirmPassword"
                       type="password"
                       th:field="*{confirmPassword}"
                       th:placeholder="#{placeholder.confirmPassword}"
                       autocomplete="new-password"
                       th:classappend="${#fields.hasErrors('confirmPassword')} ? ' error-field' : ''">
                <span class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">Confirm password error</span>
            </div>

            <button type="submit" th:text="#{button.register}">Create Account</button>

            <p class="helper-link">
                <a th:href="@{/login}" th:text="#{auth.link.login}">Already registered? Back to login</a>
            </p>
        </form>
    </section>
</main>
</body>
</html>
