<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
</head>
<body>
  <h2>Register</h2>
  <form th:action="@{/register}" th:object="${form}" method="post">
      <div>
        <label>Username</label>
        <input type="text" th:field="*{username}">
        <div style="color:red;" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
      </div>
      <div>
        <label>Password</label>
        <input type="password" th:field="*{password}">
        <div style="color:red;" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
      </div>
      <div>
          <label>Confirm Password</label>
          <input type="password" th:field="*{confirmPassword}">
          <div style="color:red;" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
      </div>

    <button type="submit">Create Account</button>
  </form>
<p>
  <a th:href="@{/login}">Back to login</a>
</p>

  <style>
      /* Reset */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

/* Page layout */
body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Form container */
form {
    background: white;
    padding: 35px 40px;
    border-radius: 10px;
    width: 320px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

/* Title */
/* Title above the form */
h2 {
    position: absolute;
    top: calc(50% - 210px); /* поднимаем над формой */
    left: 50%;
    transform: translateX(-50%);
    font-family: "Segoe UI", Arial, sans-serif;
    color: white;
    font-size: 28px;
    font-weight: 600;
}

/* Form fields container */
form div {
    margin-bottom: 15px;
}

/* Labels */
label {
    display: block;
    font-size: 14px;
    margin-bottom: 6px;
    color: #555;
}

/* Inputs */
input {
    width: 100%;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 14px;
    transition: border 0.2s;
}

input:focus {
    border-color: #4f46e5;
    outline: none;
}

/* Error messages */
div[style*="color:red"] {
    font-size: 12px;
    margin-top: 5px;
}

/* Button */
button {
    width: 100%;
    padding: 11px;
    border: none;
    border-radius: 6px;
    background: #4f46e5;
    color: white;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
}

button:hover {
    background: #4338ca;
}

/* Back to login link */
p {
    text-align: center;
    margin-top: 15px;
}

a {
    color: #4f46e5;
    text-decoration: none;
    font-size: 14px;
}

a:hover {
    text-decoration: underline;
}
  </style>
</body>
</html>
